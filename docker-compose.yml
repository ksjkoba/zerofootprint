services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: zf_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  auditor-engine:
    build: ./backend
    container_name: zf_backend
    ports:
      - "8090:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./backend:/app
      - ./frontend:/app/frontend
    depends_on:
      - qdrant
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_storage:
